<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini-Project 1 · Student CRUD</title><style>body{font-family:Inter,system-ui;margin:0;background:#0b1020;color:#eef2ff;padding:24px}.wrap{max-width:1000px;margin:auto}.card{background:#111a30;border:1px solid #2b3a60;border-radius:18px;padding:22px;margin:14px 0}input,button,select{font:inherit;padding:10px;border-radius:10px;border:1px solid #3a4b78;background:#0a1326;color:#fff}button{cursor:pointer;background:#5b7cfa;border-color:#6d8cff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.row{display:flex;gap:10px;flex-wrap:wrap}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid #293757}.muted{color:#9eb0d8}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#1d2b4d}</style></head><body><div class="wrap"><div class="card"><h1>Mini-Project 1 · Student Management CRUD</h1><p class="muted">Submission-ready browser demo of the Day 5 React + Node + PostgreSQL workflow. This hosted demo uses localStorage so it is self-contained.</p><div class="grid"><input id="name" placeholder="Student name"><input id="email" placeholder="Email"><input id="course" placeholder="Course"><button onclick="addStudent()">Add student</button></div><div class="row" style="margin-top:12px"><input id="search" placeholder="Search students" oninput="render()"><button onclick="exportCsv()">Export CSV</button><button onclick="seed()">Reset demo data</button></div></div><div class="card"><table><thead><tr><th>Name</th><th>Email</th><th>Course</th><th>Actions</th></tr></thead><tbody id="tbody"></tbody></table></div></div><script>const key='groovy_students';function data(){return JSON.parse(localStorage.getItem(key)||'[]')}function save(x){localStorage.setItem(key,JSON.stringify(x))}function seed(){save([{id:1,name:'Aarav Shah',email:'aarav@example.com',course:'AI Engineering'},{id:2,name:'Meera Patel',email:'meera@example.com',course:'Full Stack'},{id:3,name:'Rohan Mehta',email:'rohan@example.com',course:'Data Engineering'}]);render()}function addStudent(){const n=name.value.trim(),e=email.value.trim(),c=course.value.trim();if(!n||!e||!c)return alert('Fill all fields');const x=data();x.push({id:Date.now(),name:n,email:e,course:c});save(x);name.value=email.value=course.value='';render()}function removeStudent(id){save(data().filter(s=>s.id!==id));render()}function editStudent(id){const x=data();const s=x.find(v=>v.id===id);const n=prompt('Name',s.name),e=prompt('Email',s.email),c=prompt('Course',s.course);if(n&&e&&c){Object.assign(s,{name:n,email:e,course:c});save(x);render()}}function render(){const q=search.value.toLowerCase();tbody.innerHTML=data().filter(s=>(s.name+' '+s.email+' '+s.course).toLowerCase().includes(q)).map(s=>`<tr><td>${s.name}</td><td>${s.email}</td><td><span class="pill">${s.course}</span></td><td><button onclick="editStudent(${s.id})">Edit</button> <button onclick="removeStudent(${s.id})">Delete</button></td></tr>`).join('')}function exportCsv(){const rows=[['Name','Email','Course'],...data().map(s=>[s.name,s.email,s.course])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='students.csv';a.click()}if(!data().length)seed();else render()</script></body></html>
