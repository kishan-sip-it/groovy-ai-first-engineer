<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini-Project 2 · Smart Doc Q&A</title><style>body{font-family:Inter,system-ui;margin:0;background:#0b1020;color:#eef2ff;padding:24px}.wrap{max-width:1050px;margin:auto}.card{background:#111a30;border:1px solid #2b3a60;border-radius:18px;padding:22px;margin:14px 0}textarea,input,button,select{font:inherit;padding:11px;border-radius:10px;border:1px solid #3a4b78;background:#0a1326;color:#fff}textarea{width:100%;min-height:160px;box-sizing:border-box}button{cursor:pointer;background:#5b7cfa;border-color:#6d8cff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.grid{grid-template-columns:1fr}}.out{white-space:pre-wrap;background:#09111f;padding:16px;border-radius:12px;border:1px solid #293757;max-height:420px;overflow:auto}.muted{color:#9eb0d8}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#163b2a;color:#8cf0bd}</style></head><body><div class="wrap"><div class="card"><span class="pill">Page-aware RAG</span><h1>Mini-Project 2 · Smart Doc Q&A</h1><p class="muted">Upload a PDF or paste notes. The browser extracts real PDF pages, the backend chunks and retrieves evidence, and answers cite exact page/chunk references.</p><input type="file" id="file" accept=".pdf,.txt,.md,.csv"><button onclick="loadFile()">Load document</button><div id="status" class="muted" style="margin-top:10px">No document loaded.</div><textarea id="doc" placeholder="Paste document text here (optional)..."></textarea></div><div class="grid"><div class="card"><input id="question" style="width:100%;box-sizing:border-box" value="What is the main goal of this document?"><div style="margin-top:10px"><select id="provider"><option value="auto">Auto provider</option><option value="groq">Groq</option><option value="openai">OpenAI</option><option value="anthropic">Anthropic</option><option value="gemini">Gemini</option></select> <button onclick="ask()">Ask document</button></div><div id="answer" class="out" style="margin-top:14px">Your answer will appear here.</div></div><div class="card"><h3>Retrieved evidence</h3><div id="sources" class="out">No retrieval yet.</div></div></div></div><script>let pages=[];async function loadFile(){const f=file.files[0];if(!f)return;if(f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf')){status.textContent='Extracting PDF pages...';const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';s.type='module';document.head.appendChild(s);await new Promise(r=>setTimeout(r,700));try{const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;pages=[];for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i);const tc=await p.getTextContent();pages.push({page:i,text:tc.items.map(x=>x.str).join(' ')});}doc.value=pages.map(p=>`[Page ${p.page}]\n${p.text}`).join('\n\n');status.textContent=`Loaded ${pages.length} PDF page(s).`;}catch(e){status.textContent='PDF extraction failed in this browser; paste extracted text instead.';}}else{const text=await f.text();doc.value=text;pages=[{page:1,text}];status.textContent='Loaded text document as page 1.';}}async function ask(){const q=question.value.trim();if(!q)return;let bodyPages=pages;if(!bodyPages.length){const raw=doc.value.trim();if(!raw)return alert('Load or paste a document first');bodyPages=raw.split(/\[Page\s+(\d+)\]/i).reduce((a,x,i)=>{if(i===0&&x.trim())a.push({page:1,text:x});else if(/^\d+$/.test(x)){a.push({page:Number(x),text:''})}else if(a.length)a[a.length-1].text+=x+' ';return a;},[]);}answer.textContent='Retrieving and answering...';sources.textContent='Working...';try{const r=await fetch('/api/rag',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:q,pages:bodyPages,provider:provider.value})});const j=await r.json();if(!r.ok)throw Error(j.error||'RAG failed');answer.textContent=j.answer||'No answer';sources.textContent=(j.retrieved||[]).map(x=>`[p.${x.page} c.${x.chunk}] score=${x.score}\n${x.text}`).join('\n\n')||'No retrieved chunks.';}catch(e){answer.textContent='Error: '+e.message;sources.textContent='';}}</script></body></html>
