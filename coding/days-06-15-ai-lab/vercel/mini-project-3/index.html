<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini-Project 3 · Custom Agent</title><style>body{font-family:Inter,system-ui;margin:0;background:#0b1020;color:#eef2ff;padding:24px}.wrap{max-width:1000px;margin:auto}.card{background:#111a30;border:1px solid #2b3a60;border-radius:18px;padding:22px;margin:14px 0}textarea,input,button{font:inherit;padding:11px;border-radius:10px;border:1px solid #3a4b78;background:#0a1326;color:#fff}textarea{width:100%;min-height:140px}button{cursor:pointer;background:#5b7cfa;border-color:#6d8cff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.grid{grid-template-columns:1fr}}.out{white-space:pre-wrap;background:#09111f;padding:16px;border-radius:12px;border:1px solid #293757}.tool{padding:10px;margin:7px 0;background:#17233e;border-radius:10px}.muted{color:#9eb0d8}</style></head><body><div class="wrap"><div class="card"><h1>Mini-Project 3 · Custom Agent</h1><p class="muted">A submission-ready agent demo with three tools: calculator, web-style lookup simulation, and persistent notes (browser localStorage for the hosted demo).</p><textarea id="prompt">Calculate 17*23, save a note saying “review agent design”, then summarize what happened.</textarea><button onclick="run()">Run agent</button></div><div class="grid"><div class="card"><h3>Tool trace</h3><div id="trace"></div></div><div class="card"><h3>Agent output</h3><div id="out" class="out">Ready.</div></div></div></div><script>function calc(e){if(!/^[0-9+\-*/().%\s]+$/.test(e))throw Error('Unsafe expression');return Function('"use strict";return ('+e+')')()}function tool(t){trace.insertAdjacentHTML('beforeend',`<div class="tool">${t}</div>`)}function run(){trace.innerHTML='';out.textContent='';const p=prompt.value;let result=[];const m=p.match(/calculate\s+([0-9+\-*/().%\s]+)/i);if(m){const v=calc(m[1].trim());tool('calculator('+m[1].trim()+') → '+v);result.push('calculator result = '+v)}const note=p.match(/save a note (?:saying|that says)\s+[“\"]?([^”\"]+)[”\"]?/i);if(note){const notes=JSON.parse(localStorage.getItem('agent_notes')||'[]');notes.push(note[1]);localStorage.setItem('agent_notes',JSON.stringify(notes));tool('save_note → saved: '+note[1]);result.push('saved note = '+note[1])}if(/web|search|lookup/i.test(p)){tool('web_search → demo lookup completed');result.push('web-search tool = demo lookup completed')}if(!result.length){tool('planner → no tool call required');result.push('No tool was required; the agent can answer directly.')}out.textContent='Agent plan and result:\n\n'+result.join('\n')+'\n\nThe demo executes the available tool loop locally and records each tool call above.'}</script></body></html>
