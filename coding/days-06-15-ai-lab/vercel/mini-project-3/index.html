<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini-Project 3 · Custom Agent</title><style>body{font-family:Inter,system-ui;margin:0;background:#0b1020;color:#eef2ff;padding:24px}.wrap{max-width:1050px;margin:auto}.card{background:#111a30;border:1px solid #2b3a60;border-radius:18px;padding:22px;margin:14px 0}textarea,input,button,select{font:inherit;padding:11px;border-radius:10px;border:1px solid #3a4b78;background:#0a1326;color:#fff}textarea{width:100%;min-height:150px;box-sizing:border-box}button{cursor:pointer;background:#5b7cfa;border-color:#6d8cff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.grid{grid-template-columns:1fr}}.out{white-space:pre-wrap;background:#09111f;padding:16px;border-radius:12px;border:1px solid #293757;max-height:450px;overflow:auto}.tool{padding:12px;margin:8px 0;background:#17233e;border-radius:10px}.muted{color:#9eb0d8}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#163b2a;color:#8cf0bd}</style></head><body><div class="wrap"><div class="card"><span class="pill">Production tool loop</span><h1>Mini-Project 3 · Custom Agent</h1><p class="muted">A real server-side agent with calculator, public URL lookup, and persistence to Supabase or Slack when configured. The model chooses tools and receives their actual results.</p><textarea id="prompt">Calculate 17*23, save a note saying “review agent design”, then summarize what happened.</textarea><div style="margin-top:10px"><select id="provider"><option value="auto">Auto provider</option><option value="groq">Groq</option><option value="openai">OpenAI</option></select> <button onclick="run()">Run agent</button> <button onclick="health()">Check agent</button></div></div><div class="grid"><div class="card"><h3>Tool trace</h3><div id="trace"></div></div><div class="card"><h3>Agent output</h3><div id="out" class="out">Ready.</div></div></div></div><script>async function health(){try{const r=await fetch('/api/agent');const j=await r.json();out.textContent=`Agent online. Tools: ${j.tools.join(', ')}\nPersistence: ${j.persistence}`;}catch(e){out.textContent='Health error: '+e.message}}async function run(){trace.innerHTML='';out.textContent='Running real agent...';try{const r=await fetch('/api/agent',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt:prompt.value,provider:provider.value})});const j=await r.json();if(!r.ok)throw Error(j.error||'Agent failed');out.textContent=`${j.text||''}\n\nProvider: ${j.provider||'mock'}\nModel: ${j.model||'n/a'}`;(j.toolTrace||[]).forEach(t=>{const d=document.createElement('div');d.className='tool';d.textContent=`${t.tool}\nargs: ${JSON.stringify(t.args)}\nresult: ${t.result}`;trace.appendChild(d);});if(!j.toolTrace?.length)trace.innerHTML='<div class="tool">No tool call was required.</div>';}catch(e){out.textContent='Error: '+e.message;}}</script></body></html>
